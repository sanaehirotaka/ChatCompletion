<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link href="main.css" rel="stylesheet">
    <script src="config.js"></script>
</head>

<body class="container-xl">
    <header class="p-2">

    </header>
    <main class="p-2">
        <div id="chat">
        </div>
    </main>
    <footer class="p-2" id="footer-drop-area">
        <div class="input-group mb-1">
            <textarea type="text" class="form-control" placeholder="メッセージを入力..." aria-label="メッセージを入力"
                rows="3"
                aria-describedby="button-send"></textarea>
            <button class="btn btn-primary" type="button" id="button-send">送信</button>
            <button type="button" class="btn btn-primary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false"></button>
            <ul class="dropdown-menu">
                <li><button class="dropdown-item" id="upload-image-button">画像を追加</button></li>
            </ul>
        </div>
        <div class="mb-1" id="stagingmedias"></div>
        <div class="mb-1" id="optionPanel">
            <label>
                <input class="form-check-input" type="checkbox" value="" id="suspendMode">
                補完を保留
            </label>
            <label>
                <input class="form-check-input" type="checkbox" value="" id="systemPromptMode">
                システムプロンプトを追加
            </label>
            <label>
                <button class="btn btn-primary" id="promptVisibilityVisible">システムプロンプトを表示</button>
                <button hidden class="btn btn-primary" id="promptVisibilityHidden">システムプロンプトを非表示</button>
            </label>
            <label>
                <select class="form-select" id="modelName">
                    <option value="gemini-3-pro-preview">Gemini 3 Pro Preview</option>
                    <option value="gemini-3-flash-preview" selected>Gemini 3 Flash Preview</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    <option value="gemini-2.5-flash"d>Gemini 2.5 Flash</option>
                </select>
            </label>
            <span>
                <button class="btn btn-primary" id="saveState">状態を保存</button>
                <button class="btn btn-primary" id="loadState">状態を復元</button>
            </span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@16.0.0/lib/marked.umd.min.js" crossorigin="anonymous" defer></script>
    <script src="auth.js" defer></script>
    <script src="chat-manager.js" defer></script>
    <script src="main.js" defer></script>
</body>

</html>
